# ------------------------------------------------------------------------------------------
# Serveur frontal de la demonstration.
#
# Il sert l'application cliente et achemine les appels vers les DEUX instances de l'application :
#   /api, /ws                     -> instance 1
#   /instance-2/api, /instance-2/ws -> instance 2
#
# Ce prefixe de chemin a une seconde utilite : le cookie de session de l'instance 2 est emis avec
# le chemin /instance-2, ce qui permet d'ouvrir une session client et une session agent dans le
# meme navigateur sans qu'elles s'ecrasent.
#
# En production, ce role est tenu par un repartiteur de charge : personne ne choisit son instance.
# ------------------------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Instance 1 -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://app-1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://app-1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- Instance 2 -------------------------------------------------------------------------
    location /instance-2/api/ {
        proxy_pass http://app-2:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /instance-2/ws {
        proxy_pass http://app-2:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- Application monopage ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
