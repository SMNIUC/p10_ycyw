# Une règle qui ne rencontre aucun élément ne fait pas échouer le build.
#
# C'est nécessaire ici : la règle « aucun accesseur en écriture public dans le domaine » ne trouve
# — heureusement — aucun élément à contrôler. Sans ce réglage, elle échouerait pour absence de
# matière, et le seul moyen de la faire passer serait d'introduire la faute qu'elle interdit.
#
# La contrepartie est connue : une règle mal écrite, visant un paquet inexistant, passerait alors
# silencieusement. C'est exactement le piège du contrôle qui « ne trouve rien » parce qu'il ne
# contrôle rien. ArchitectureRulesAreEffectiveTest le neutralise en vérifiant que chaque règle
# refuse bien une classe fautive.
archRule.failOnEmptyShould=false
