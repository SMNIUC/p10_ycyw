# Une regle qui ne rencontre aucun element ne fait pas echouer le build.
#
# C'est necessaire ici : la regle « aucun accesseur en ecriture public dans le domaine » ne trouve
# — heureusement — aucun element a controler. Sans ce reglage, elle echouerait pour absence de
# matiere, et le seul moyen de la faire passer serait d'introduire la faute qu'elle interdit.
#
# La contrepartie est connue : une regle mal ecrite, visant un paquet inexistant, passerait alors
# silencieusement. C'est exactement le piege du controle qui « ne trouve rien » parce qu'il ne
# controle rien. ArchitectureRulesAreEffectiveTest le neutralise en verifiant que chaque regle
# refuse bien une classe fautive.
archRule.failOnEmptyShould=false
